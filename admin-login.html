<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Sign In — InkConnect</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="admin-login">
<div id="loading-screen">
  <svg class="ink-loader" viewBox="0 0 160 60"><defs><linearGradient id="inkGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#4f7cff"/><stop offset="50%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#c084fc"/></linearGradient></defs><path d="M10,40 C30,10 45,50 65,25 S95,10 110,35 S140,15 150,30"/></svg>
  <span class="loading-label">Loading InkConnect</span>
</div>
<div class="aurora-bg"><div class="grain"></div></div>

<header class="site-header">
  <div class="container flex-between">
    <a href="index.html" class="logo">
      <svg class="logo-mark" viewBox="0 0 40 40"><defs><linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#4f7cff"/><stop offset="100%" stop-color="#c084fc"/></linearGradient></defs>
        <rect width="40" height="40" rx="12" fill="url(#logoGrad)"/><path d="M12 28 C16 14 24 26 28 12" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/></svg>
      InkConnect
    </a>
    <div class="nav-actions">
      <button class="icon-btn theme-toggle" aria-label="Toggle theme">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </div>
</header>

<main class="page-main page-fade">
  <section class="section" style="padding-top: var(--space-8);">
    <div class="container">
      <div class="glass form-card">
        <div class="text-center mb-4">
          <span class="eyebrow">Administrator access</span>
          <h1 class="h-2 mt-1">Admin sign in</h1>
          <p class="muted mt-1" style="font-size:.85rem;">This page is for InkConnect administrators only.</p>
        </div>
        <form id="admin-login-form" novalidate>
          <div class="field">
            <label for="email">Admin email</label>
            <input type="email" id="email" name="email" required autocomplete="email">
            <div class="field-error"></div>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required autocomplete="current-password">
            <div class="field-error"></div>
          </div>
          <button type="submit" class="btn btn-primary btn-block">Sign In as Admin</button>
        </form>
      </div>
    </div>
  </section>
</main>

<script src="assets/js/api.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/admin-login.js"></script>
</body>
</html>
